name: 'Upload artifacts to S3'
description: >-
  Drop-in replacement for actions/upload-artifact. Stores build output in the
  org's Ceph/RGW S3 instead of GitHub artifact storage, which is capped on the
  free plan and, once full, fails every upload org-wide with
  "Artifact storage quota has been hit".

inputs:
  name:
    description: 'Artifact name. Becomes a path segment in the S3 key, so keep it filesystem-safe.'
    required: true
  path:
    description: 'File, directory, or shell glob to upload. A directory uploads recursively.'
    required: true
  access-key-id:
    description: 'Pass the S3 access key from secrets.S3_ACCESS_KEY. Composite actions cannot read secrets themselves.'
    required: true
  secret-access-key:
    description: 'Pass the S3 secret key from secrets.S3_SECRET_KEY.'
    required: true
  bucket:
    description: 'Target bucket. Use public-artifacts only for output meant to be world-readable.'
    required: false
    default: 'github-artifacts'
  endpoint:
    description: 'S3 endpoint.'
    required: false
    default: 'https://s3.sd.kazer.org'
  if-no-files-found:
    description: 'warn | error | ignore — mirrors actions/upload-artifact.'
    required: false
    default: 'warn'

outputs:
  s3-uri:
    description: 'The s3:// prefix the files were written to.'
    value: ${{ steps.upload.outputs.s3-uri }}

runs:
  using: composite
  steps:
    # Many callers run inside `container:` jobs built from slim images that have
    # no aws CLI, so installing it is the action's job rather than every caller's.
    # Debian's `awscli` is v1, which is fine: --endpoint-url has been supported
    # since v1 and nothing here uses a v2-only flag.
    - name: Ensure aws CLI
      shell: bash
      run: |
        set -euo pipefail
        if command -v aws >/dev/null 2>&1; then
          echo "aws present: $(aws --version 2>&1)"
          exit 0
        fi
        echo "aws not found; installing"
        SUDO=""
        [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1 && SUDO="sudo"
        if command -v apt-get >/dev/null 2>&1; then
          $SUDO apt-get update -qq
          # Ubuntu 24.04+ has no awscli package ("no installation candidate"):
          # use AWS's own v2 installer there.
          if ! $SUDO apt-get install -y -qq awscli; then
            $SUDO apt-get install -y -qq curl unzip ca-certificates
            curl -sSfL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o /tmp/awscliv2.zip
            unzip -qo /tmp/awscliv2.zip -d /tmp
            $SUDO /tmp/aws/install --update
          fi
        elif command -v apk >/dev/null 2>&1; then
          $SUDO apk add --no-cache aws-cli
        elif command -v dnf >/dev/null 2>&1; then
          $SUDO dnf install -y -q awscli
        elif command -v yum >/dev/null 2>&1; then
          $SUDO yum install -y -q awscli
        elif command -v pip3 >/dev/null 2>&1; then
          pip3 install --quiet --disable-pip-version-check awscli
        elif command -v brew >/dev/null 2>&1; then
          brew install awscli
        else
          echo "::error::no supported package manager found to install the aws CLI"
          exit 1
        fi
        aws --version 2>&1

    - name: Upload to S3
      id: upload
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
        IN_PATH: ${{ inputs.path }}
        IN_NAME: ${{ inputs.name }}
        BUCKET: ${{ inputs.bucket }}
        ENDPOINT: ${{ inputs.endpoint }}
        ON_MISSING: ${{ inputs.if-no-files-found }}
        # With no region configured, aws-cli v2 asks the EC2 metadata service
        # for one on every client it builds -- 2 s of connect timeouts each,
        # ~6 s per `aws s3` call on our runners, for an endpoint that is not AWS.
        # Credentials always come from the env above, so nothing needs IMDS.
        AWS_EC2_METADATA_DISABLED: 'true'
      run: |
        set -uo pipefail

        if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
          echo "::error::S3 credentials are empty. Pass access-key-id/secret-access-key from secrets.S3_ACCESS_KEY / secrets.S3_SECRET_KEY, and check the repo actually has them set."
          exit 1
        fi

        # Same layout as the pre-existing hand-rolled uploads in r2d2-solidworks,
        # plus the artifact name so one run's separate artifacts stay separate.
        PREFIX="${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}/${IN_NAME}"
        DEST="s3://${BUCKET}/${PREFIX}"
        echo "s3-uri=${DEST}" >> "$GITHUB_OUTPUT"

        # A glob must expand here; quoting IN_PATH would upload a literal '*'.
        # globstar matters: actions/upload-artifact treats '**' as recursive, and
        # plain bash does not -- without it 'out/**/x.log' quietly matches only one
        # level down and deeper files are missed with no error.
        #
        # macOS ships bash 3.2, which predates globstar, and GitHub runs `run:`
        # blocks with `bash -e` -- so `shopt -s globstar` did not degrade, it killed
        # the step outright, and this action had never once worked on a macOS runner.
        # Ask for it, carry on without it, and refuse only when the path actually
        # needs it: silently uploading a subset would be worse than failing.
        shopt -s nullglob
        HAVE_GLOBSTAR=1
        shopt -s globstar 2>/dev/null || HAVE_GLOBSTAR=0
        if [ "${HAVE_GLOBSTAR}" -eq 0 ]; then
          case "${IN_PATH}" in
            *'**'*)
              echo "::error::path '${IN_PATH}' uses '**', but bash ${BASH_VERSION} has no globstar (macOS ships 3.2). Name the directory instead -- a directory uploads recursively."
              exit 1 ;;
          esac
        fi
        # shellcheck disable=SC2206
        MATCHES=( ${IN_PATH} )
        shopt -u nullglob
        if [ "${HAVE_GLOBSTAR}" -eq 1 ]; then shopt -u globstar; fi

        # A path with no glob characters survives nullglob even when it does not
        # exist, and aws then fails the step on it. Drop it so if-no-files-found
        # decides, as in actions/upload-artifact. (The ${a[@]+...} form keeps an
        # empty array safe under set -u on bash 3.2.)
        EXISTING=()
        for m in ${MATCHES[@]+"${MATCHES[@]}"}; do
          if [ -e "$m" ]; then EXISTING+=("$m"); fi
        done
        MATCHES=(${EXISTING[@]+"${EXISTING[@]}"})

        if [ ${#MATCHES[@]} -eq 0 ]; then
          MSG="no files matched path '${IN_PATH}'"
          case "${ON_MISSING}" in
            error)  echo "::error::${MSG}"; exit 1 ;;
            ignore) echo "${MSG} (ignored)"; exit 0 ;;
            *)      echo "::warning::${MSG}"; exit 0 ;;
          esac
        fi

        # "<key><TAB><size>" for every file that should end up in the bucket.
        EXPECTED="$(mktemp "${RUNNER_TEMP:-/tmp}/upload-s3.XXXXXX")"
        LISTED="$(mktemp "${RUNNER_TEMP:-/tmp}/upload-s3.XXXXXX")"
        trap 'rm -f "$EXPECTED" "$LISTED"' EXIT

        rc=0
        for m in "${MATCHES[@]}"; do
          if [ -d "$m" ]; then
            # A single directory uploads its CONTENTS under the artifact name, matching
            # actions/upload-artifact. Adding basename here would nest it twice
            # (.../<name>/<name>/...). With several matches the basename is what keeps
            # them apart, so it is only added then.
            if [ ${#MATCHES[@]} -eq 1 ]; then SUB=""; else SUB="$(basename "$m")/"; fi
            echo "uploading directory $m -> ${DEST}/${SUB}"
            aws s3 cp "$m" "${DEST}/${SUB}" \
              --recursive --only-show-errors --endpoint-url "${ENDPOINT}" || rc=$?
            # -L: aws follows symlinks by default, and skips broken ones and FIFOs.
            d="${m%/}"
            find -L "$d" -type f | while IFS= read -r f; do
              printf '%s\t%s\n' "${PREFIX}/${SUB}${f#"$d"/}" "$(wc -c < "$f" | tr -d ' ')"
            done >> "$EXPECTED"
          else
            echo "uploading file $m -> ${DEST}/"
            aws s3 cp "$m" "${DEST}/$(basename "$m")" \
              --only-show-errors --endpoint-url "${ENDPOINT}" || rc=$?
            printf '%s\t%s\n' "${PREFIX}/$(basename "$m")" "$(wc -c < "$m" | tr -d ' ')" >> "$EXPECTED"
          fi
        done

        if [ "$rc" -ne 0 ]; then
          echo "::error::upload to ${DEST} failed (exit $rc)"
          exit "$rc"
        fi

        # The exit code alone is not proof. aws-cli 2.36 exits 0 when every attempt
        # got no HTTP response: the failure handler hits an AttributeError on the
        # missing response and the error is swallowed. stdio42/jojo's nightly
        # "uploaded" that way (3 x 60 s read timeouts, then success, nothing in
        # the bucket). So check that every file is there at its local size.
        # ponytail: a re-run attempt shares GITHUB_RUN_ID, so a same-size object
        # left by the previous attempt would pass; compare ETags if that matters.
        if ! aws s3 ls "${DEST}/" --recursive --endpoint-url "${ENDPOINT}" > "$LISTED"; then
          echo "::error::could not list ${DEST} to verify the upload"
          exit 1
        fi
        MISSING="$(LC_ALL=C comm -23 <(LC_ALL=C sort "$EXPECTED") \
          <(awk '{ s = $3; sub(/^[^ ]+ +[^ ]+ +[0-9]+ /, ""); print $0 "\t" s }' "$LISTED" | LC_ALL=C sort))"
        if [ -n "$MISSING" ]; then
          echo "::error::aws reported success, but $(printf '%s\n' "$MISSING" | wc -l | tr -d ' ') file(s) are not in ${DEST} at their local size"
          printf '%s\n' "$MISSING" | head -20
          exit 1
        fi

        # The clickable artifact link is gone, so print where things landed.
        echo "::notice::artifacts at ${DEST}"
        echo "Uploaded ${#MATCHES[@]} path(s) to ${DEST}"
