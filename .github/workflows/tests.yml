name: tests

# This repo is composite actions and reusable workflows — nothing compiles, so
# this is the only guard on the shell embedded in them. Add to it rather than
# leaving new embedded logic untested.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # Organization policy forbids hosted fallback, including for public repos.
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/ci_policy.py .
      - name: Existing S3 action checks
        run: |
          set -euo pipefail
          for t in tests/test-*.sh; do "$t"; done
