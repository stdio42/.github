name: tests

# This repo is composite actions and reusable workflows — nothing compiles, so
# this is the only guard on the shell embedded in them. Add to it rather than
# leaving new embedded logic untested.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # ubuntu-latest, not the org's self-hosted linux pool: this repo is PUBLIC,
    # and the runner group has allows_public_repositories = false, so a
    # self-hosted job here is never picked up -- it queues for 24h and GitHub
    # cancels it. That is why every run in this repo's history is "cancelled".
    # GitHub-hosted minutes are free for public repos.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for t in tests/test-*.sh; do echo "--- $t"; "$t"; done
