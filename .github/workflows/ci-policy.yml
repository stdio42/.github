name: Organization CI policy
on:
  workflow_call:
permissions:
  contents: read
jobs:
  policy:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: policy-target
      - uses: actions/checkout@v4
        with:
          repository: stdio42/.github
          ref: main
          persist-credentials: false
          path: policy-shared
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r policy-shared/scripts/requirements.txt
      - run: python policy-shared/scripts/ci_policy.py policy-target
