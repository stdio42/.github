name: Claude Code

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label(s) as JSON array'
        type: string
        default: '["self-hosted", "linux"]'
      allowed-tools:
        description: 'Comma-separated list of allowed tools'
        type: string
        default: 'Bash(git *),Bash(gh *),Bash(npm *),Bash(python *),Bash(pytest *),Bash(pip *),Bash(ls *),Bash(mkdir *),Bash(cp *),Bash(mv *),Bash(wc *),Bash(rm *),Bash(touch *),Edit,Write,Read,Glob,Grep,Agent'
      extra-prompt:
        description: 'Additional repo-specific instructions'
        type: string
        default: ''
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  runner-policy:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    uses: ./.github/workflows/validate-runner.yml
    with:
      labels: ${{ inputs.runs-on }}
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    needs: runner-policy
    runs-on: ${{ fromJSON(needs.runner-policy.outputs.labels) }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            Before working on any stdio42 repository, read the current shared
            instructions in stdio42/.github/AGENTS.md and docs/ci-policy.md using
            the GitHub API. Consult the listed shared CI repositories before
            creating or changing workflows. Use only self-hosted runners with
            explicit OS labels and organization S3 artifacts; never use a hosted
            runner fallback or treat billing changes as a remedy for routing.

            Follow and complete this request:
            ${{ github.event.comment.body || github.event.review.body || github.event.issue.body || github.event.issue.title }}

            If this run is in a pull request context, after completing the request, re-assess the pull request and update labels so exactly one of these labels is present:
            - changes requested
            - approved for merge

            If changes are still needed, ensure "changes requested" is present and remove "approved for merge".
            If the pull request is ready to merge, ensure "approved for merge" is present and remove "changes requested".
            ${{ inputs.extra-prompt }}
          claude_args: '--allowedTools "${{ inputs.allowed-tools }}"'
